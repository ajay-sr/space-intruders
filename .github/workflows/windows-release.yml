name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DSPACE_INTRUDERS_FETCH_SDL2=ON -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix package/space-intruders
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path package/space-intruders -DestinationPath space-intruders-windows-x64.zip

      - name: Smoke test packaged game
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          $game = Start-Process -FilePath package/space-intruders/space_intruders.exe -PassThru
          try {
            Start-Sleep -Seconds 2
            if ($game.HasExited) {
              throw "Packaged game exited unexpectedly with code $($game.ExitCode)"
            }
          } finally {
            if (-not $game.HasExited) { Stop-Process -Id $game.Id }
          }

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: space-intruders-windows-x64
          path: space-intruders-windows-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: space-intruders-windows-x64

      - name: Publish release with Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" space-intruders-windows-x64.zip
          --verify-tag --title "Space Intruders $RELEASE_TAG" --generate-notes
